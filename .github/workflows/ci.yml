# Windows is the tested and shipped platform. A single short job replaces the
# former Linux gate and duplicate Linux test build.
name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '_shots/**'
      - '.github/labels.yml'
      - '.github/sync-labels.sh'
      - '.github/workflows/sync-labels.yml'
      - '.github/workflows/release.yml'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '_shots/**'
      - '.github/labels.yml'
      - '.github/sync-labels.sh'
      - '.github/workflows/sync-labels.yml'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      depth:
        description: 'quick = tests; full = clippy, features and release build'
        type: choice
        options: [quick, full]
        default: quick

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  windows:
    name: Windows build and tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Cache verified bundled CPython
        uses: actions/cache@v6
        with:
          path: vendor/pbs-cache
          key: pbs-${{ runner.os }}-${{ hashFiles('crates/neuron-core/build.rs') }}
          restore-keys: pbs-${{ runner.os }}-
      - name: Validate Windows workspace
        shell: pwsh
        run: ./validate.ps1 -Mode ${{ inputs.depth == 'full' && 'full' || 'quick' }} -Locked
