# Manually reconcile .github/labels.yml with repository labels.
#
# labels.yml is the configuration of record; this runs the same sync-labels.sh you'd run by
# hand, so there's exactly one implementation.
#
# Safe on every change: the sync is idempotent and never deletes a label. A label that exists
# on GitHub but not in the file is reported in the run log, not removed.
#
# Manual-only on Windows so labels maintenance does not consume scheduled CI minutes.

name: sync-labels

on:
  workflow_dispatch:

permissions:
  # Checkout needs contents read; label writes need issues write.
  contents: read
  issues: write # creating/updating labels is an issues-scoped permission

concurrency:
  group: sync-labels
  cancel-in-progress: false # never interrupt a half-applied label set

jobs:
  sync:
    runs-on: windows-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - name: sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/sync-labels.sh "${{ github.repository }}"
